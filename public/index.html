<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Llegadas y salidas en tiempo real de los aeropuertos de Bolivia — El Alto, Viru Viru, Jorge Wilstermann y más.">
  <meta property="og:title" content="Lynceus Aero — Vuelos de Bolivia en tiempo real">
  <meta property="og:description" content="Llegadas y salidas en tiempo real de los aeropuertos de Bolivia.">
  <meta property="og:type" content="website">
  <title>Lynceus Aero</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Runs sync before CSS paints — prevents flash of wrong theme -->
  <script>
    document.documentElement.setAttribute('data-theme',
      localStorage.getItem('lynceus_theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    );
  </script>
  <link rel="preload" href="fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plex-mono-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ptr" id="ptr" aria-hidden="true">
    <svg class="icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
  </div>

  <header class="header">
    <div class="header-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2.6 13.4 1 11.2l1.9-.5 1.7 1.6 3.3-.9L4.3 4.9l2.4-.65 6.9 5.55 5.2-1.4a2.1 2.1 0 0 1 1.1 4.05L5.1 16.2a1.5 1.5 0 0 1-1.4-.35z" fill="currentColor"/>
        <path d="M3 20.5h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name" translate="no">Lynceus <span class="brand-aero">Aero</span></span>
    </div>
    <div class="header-right">
      <span class="live-badge" id="live-badge">
        <span class="live-dot"></span>
        <span data-i18n="live">EN VIVO</span>
      </span>
      <span class="last-updated" id="last-updated"></span>
      <div class="header-controls" id="header-controls">
        <div class="ctrl-row" id="sound-row" hidden>
          <button class="theme-btn" id="sound-btn" aria-label="Activar sonido"></button>
          <span class="ctrl-label" data-i18n="labelSound">Sonido</span>
        </div>
        <div class="ctrl-row">
          <button class="theme-btn" id="view-btn" aria-label="Ver como tablero"></button>
          <span class="ctrl-label" data-i18n="labelView">Vista</span>
        </div>
        <div class="ctrl-row">
          <select class="lang-select" id="lang-select" data-i18n-aria="selectLanguage" aria-label="Seleccionar idioma">
            <option value="es">ES</option>
            <option value="en">EN</option>
            <option value="pt-BR">PT</option>
          </select>
          <span class="ctrl-label" data-i18n="labelLanguage">Idioma</span>
        </div>
        <div class="ctrl-row">
          <button class="theme-btn" id="theme-btn" data-i18n-aria="themeToDark" aria-label="Cambiar a modo oscuro"></button>
          <span class="ctrl-label" data-i18n="labelTheme">Tema</span>
        </div>
      </div>
      <button class="theme-btn nav-toggle" id="nav-toggle" aria-expanded="false"
        aria-controls="header-controls" data-i18n-aria="menu" aria-label="Menú"></button>
    </div>
  </header>

  <div class="airport-bar">
    <select id="airport-select" class="airport-select" data-i18n-aria="selectAirport" aria-label="Seleccionar aeropuerto">
      <option value="Cobija">Cobija · CIJ</option>
      <option value="Jorge Wilstermann">Cochabamba · CBB</option>
      <option value="El ALTo">El Alto · LPB</option>
      <option value="Guayamerin">Guayaramerín · GYA</option>
      <option value="Oruro">Oruro · ORU</option>
      <option value="Potosi">Potosí · POI</option>
      <option value="Riberalta">Riberalta · RIB</option>
      <option value="Rurrenabaque">Rurrenabaque · RBQ</option>
      <option value="Viru Viru">Santa Cruz · VVI</option>
      <option value="Sucre">Sucre · SRE</option>
      <option value="Tarija">Tarija · TJA</option>
      <option value="Trinidad">Trinidad · TDD</option>
      <option value="Uyuni">Uyuni · UYU</option>
      <option value="Yacuiba">Yacuiba · BYC</option>
    </select>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tipo="L" role="tab" aria-selected="true">
      <svg class="icon tab-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 22h20"/><path d="M3.77 10.77 2 9l2-4.5 1.1.55c.55.28.9.84.9 1.45s.35 1.17.9 1.45L8 8.5l3-6 1.05.53a2 2 0 0 1 1.09 1.52l.72 5.4a2 2 0 0 0 1.09 1.52l4.4 2.2c.42.22.78.55 1.01.96l.6 1.03c.49.88-.06 1.98-1.06 2.1l-1.18.15c-.47.06-.95-.02-1.37-.24L4.29 11.15a2 2 0 0 1-.52-.38Z"/></svg>
      <span data-i18n="arrivals">Llegadas</span>
    </button>
    <button class="tab" data-tipo="S" role="tab" aria-selected="false">
      <svg class="icon tab-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 22h20"/><path d="M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.18Z"/></svg>
      <span data-i18n="departures">Salidas</span>
    </button>
    <div class="tab-indicator" aria-hidden="true"></div>
  </div>

  <div class="search-bar" id="search-bar">
    <div class="search-wrap">
      <svg class="icon search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <input class="search-input" id="search-input" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Vuelo, destino o aerolínea…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="search-clear" id="search-clear" data-i18n-aria="clearSearch" aria-label="Limpiar búsqueda" tabindex="-1">
        <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <div class="sort-bar" id="sort-bar" role="group" data-i18n-aria="sortGroup" aria-label="Ordenar vuelos">
    <button class="sort-pill active" data-sort="time" data-i18n="sortTime">Hora</button>
    <button class="sort-pill" data-sort="delayed" data-i18n="sortDelayed">Demorados primero</button>
    <button class="sort-pill" data-sort="airline" data-i18n="sortAirline">Aerolínea</button>
  </div>

  <div class="summary-strip" id="summary-strip" aria-live="polite"></div>

  <main id="flights-list" class="flights-list" role="list" data-i18n-aria="flightsList" aria-label="Lista de vuelos">
  </main>

  <div class="offline-banner" id="offline-banner" hidden>
    <svg class="icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
    <span data-i18n="offline">Sin conexión</span>
  </div>

  <button class="scroll-top" id="scroll-top" data-i18n-aria="scrollTop" aria-label="Volver arriba" hidden>
    <svg class="icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
  </button>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-sheet" id="modal-sheet" role="dialog" aria-modal="true">
      <div class="modal-handle" aria-hidden="true"></div>
      <button class="modal-close" id="modal-close" data-i18n-aria="close" aria-label="Cerrar">
        <svg class="icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
